<div class="mx-auto max-w-sm p-6">
  <h1 class="mb-6 text-2xl font-semibold">Your profile</h1>

  @if (loading()) {
    <p class="text-sm text-gray-600">Loading…</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label for="gender" class="block text-sm font-medium">Gender</label>
        <select
          id="gender"
          formControlName="gender"
          class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 text-sm"
        >
          <option value="">Not set</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>

      <div>
        <label for="dateOfBirth" class="block text-sm font-medium">Date of birth</label>
        <input
          id="dateOfBirth"
          type="date"
          formControlName="dateOfBirth"
          class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 text-sm"
        />
      </div>

      <div>
        <label for="occupationName" class="block text-sm font-medium">Occupation</label>
        <input
          id="occupationName"
          type="text"
          formControlName="occupationName"
          class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 text-sm"
        />
      </div>

      @if (errorMessage(); as message) {
        <p class="text-sm text-red-600">{{ message }}</p>
      }
      @if (savedMessage(); as message) {
        <p class="text-sm text-green-700">{{ message }}</p>
      }

      <button
        type="submit"
        [disabled]="saving()"
        class="w-full rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white disabled:opacity-50"
      >
        {{ saving() ? 'Saving…' : 'Save' }}
      </button>
    </form>
  }
</div>
